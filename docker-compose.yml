services:
  postgres:
    image: postgres:16
    container_name: ahg_pos_postgres
    environment:
      POSTGRES_DB: ahg_pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ahg_pos_pgdata:/var/lib/postgresql/data

volumes:
  ahg_pos_pgdata:
